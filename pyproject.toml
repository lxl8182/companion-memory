[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "companion-memory"
version = "0.1.0.dev6"
description = "Host-independent companion memory and persona evolution core"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.scripts]
companion-memory = "companion_memory.__main__:main"
companion-memory-run = "companion_memory.cli:main"
companion-stack = "companion_memory.stack:main"

[tool.hatch.build.targets.wheel]
packages = ["src/companion_memory"]

[tool.hatch.build.targets.wheel.force-include]
"webui/designs/tidebell" = "companion_memory/webui"

[tool.hatch.build.targets.sdist]
# Keep release archives small and reproducible: source, tests, docs and the
# WebUI resources; never ship local scratch or build output.
exclude = [
  "/.scratch",
  "/dist",
  "/output",
  "/.venv",
  "/webui/assets",
  "**/__pycache__",
  "**/*.pyc",
]

