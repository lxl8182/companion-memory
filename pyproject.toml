[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "rin-memory"
version = "0.1.0.dev11"
description = "RIN: Recall, Identity, Nurture. Editable personas, continuous growth and long-term companion memory."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.scripts]
rin-memory = "rin_memory.__main__:main"
rin-memory-run = "rin_memory.cli:main"
rin-stack = "rin_memory.stack:main"

[project.urls]
Homepage = "https://github.com/lxl8182/rin-memory"
Repository = "https://github.com/lxl8182/rin-memory"
Issues = "https://github.com/lxl8182/rin-memory/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rin_memory"]

[tool.hatch.build.targets.wheel.force-include]
"webui/designs/tidebell" = "rin_memory/webui"

[tool.hatch.build.targets.sdist]
# Keep release archives small and reproducible: source, tests, docs and the
# WebUI resources; never ship local scratch or build output.
exclude = [
  "/.scratch",
  "/dist",
  "/output",
  "/.venv",
  "/webui/assets",
  "**/__pycache__",
  "**/*.pyc",
]

